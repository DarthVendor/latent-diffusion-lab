[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "latent-diffusion-lab"
version = "0.1.0"
description = "Reproducible continuous latent reasoning and masked diffusion decoding experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "pyyaml>=6.0"]
[project.optional-dependencies]
qwen = ["transformers>=4.51", "accelerate>=1.0", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
ldlab = "latent_diffusion.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
